services:
  redis:
    image: redis:alpine
    container_name: beta-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    build: .
    container_name: beta-worker
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MAX_RETRIES: "2"
      BASE_BACKOFF_SECONDS: "2"
    command: >
      celery -A celery_app.celery worker
      -l INFO
      -Q beta,beta.dlq
    volumes:
      - dlqdata:/data
    restart: unless-stopped

  producer:
    build: .
    container_name: beta-producer
    depends_on:
      - redis
      - worker
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: python -m producer
    restart: "no"
    profiles: [ "demo" ]

  tests:
    build: .
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      PYTHONPATH: /workspace:/workspace/beta_worker
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
    command: pytest -q beta_worker/tests

volumes:
  dlqdata:
